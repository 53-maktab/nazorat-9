<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5B-sinf | Informatika nazorat ishi</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273549; --accent:#6366f1; --accent2:#818cf8;
    --text:#e2e8f0; --muted:#94a3b8; --good:#22c55e; --bad:#ef4444; --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e1b4b); color:var(--text); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px;
  }
  .wrap{ width:100%; max-width:720px; }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:28px 24px; margin-bottom:16px; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  h1{ font-size:1.4rem; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:.9rem; margin-bottom:20px; }
  label{ display:block; font-size:.85rem; color:var(--muted); margin:14px 0 6px; }
  input, select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:1rem; outline:none;
  }
  input:focus, select:focus{ border-color:var(--accent); }
  button{
    cursor:pointer; border:none; border-radius:10px; padding:12px 18px;
    background:var(--accent); color:white; font-size:1rem; font-weight:600;
    transition:background .15s;
  }
  button:hover{ background:var(--accent2); }
  button.secondary{ background:var(--card2); border:1px solid var(--border); color:var(--text); }
  button.danger{ background:#7f1d1d; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .lang-switch{ display:flex; gap:8px; margin-bottom:18px; }
  .lang-switch button{ flex:1; background:var(--card2); border:1px solid var(--border); color:var(--muted); font-weight:600; }
  .lang-switch button.active{ background:var(--accent); color:white; border-color:var(--accent); }
  .error{ color:var(--bad); font-size:.9rem; margin-top:10px; min-height:1.2em; }
  .ok{ color:var(--good); font-size:.9rem; margin-top:10px; }
  .q-box{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--card2); }
  .q-num{ color:var(--accent2); font-weight:700; font-size:.85rem; margin-bottom:6px; }
  .q-text{ font-size:1.02rem; margin-bottom:12px; }
  .opt{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--border); margin-bottom:8px; cursor:pointer;
  }
  .opt:hover{ border-color:var(--accent); }
  .opt input{ width:auto; }
  .opt.selected{ border-color:var(--accent); background:rgba(99,102,241,.12); }
  .opt.correct{ border-color:var(--good); background:rgba(34,197,94,.12); }
  .opt.wrong{ border-color:var(--bad); background:rgba(239,68,68,.12); }
  .progress-bar{ height:6px; background:var(--card2); border-radius:3px; overflow:hidden; margin-bottom:18px; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .2s; }
  .score-big{ font-size:3rem; font-weight:800; text-align:center; margin:10px 0; }
  .score-sub{ text-align:center; color:var(--muted); margin-bottom:20px; }
  table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th{ color:var(--muted); font-weight:600; }
  .pill{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:600; }
  .pill.done{ background:rgba(34,197,94,.15); color:var(--good); }
  .pill.pending{ background:rgba(148,163,184,.15); color:var(--muted); }
  .small-btn{ padding:6px 10px; font-size:.8rem; border-radius:6px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .hidden{ display:none !important; }
  .muted{ color:var(--muted); font-size:.85rem; }
  .footer-note{ text-align:center; color:var(--muted); font-size:.75rem; margin-top:10px; }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; max-width:400px; width:100%; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const T = {
  uz: {
    title: "5B-sinf — Informatika nazorat ishi",
    loginTitle: "O'quvchi kirishi",
    login: "Login", password: "Parol", enter: "Kirish",
    adminLink: "O'qituvchi uchun",
    studentLink: "O'quvchi uchun",
    wrongCreds: "Login yoki parol noto'g'ri",
    startTest: "Testni boshlash",
    question: "savol",
    next: "Keyingisi", prev: "Orqaga", finish: "Testni yakunlash",
    confirmFinish: "Testni yakunlamoqchimisiz? Keyin javoblarni o'zgartirib bo'lmaydi.",
    yourScore: "Sizning natijangiz",
    outOf: "dan",
    correct: "To'g'ri", wrong: "Noto'g'ri", notAnswered: "Javob berilmagan",
    reviewTitle: "Javoblaringiz tahlili",
    logout: "Chiqish",
    adminTitle: "O'qituvchi paneli",
    adminLoginTitle: "O'qituvchi kirishi",
    group: "Guruh", fullName: "F.I.SH", result: "Natija", status: "Holat",
    doneStatus: "Topshirilgan", pendingStatus: "Hali topshirmagan",
    reopen: "Qayta ochish", changePass: "Parolni o'zgartirish",
    adminChangeOwnPass: "O'z parolimni o'zgartirish",
    newPassword: "Yangi parol", oldPassword: "Eski parol", save: "Saqlash", cancel: "Bekor qilish",
    passChanged: "Parol muvaffaqiyatli o'zgartirildi",
    confirmReopen: "Ushbu o'quvchi uchun testni qayta ochmoqchimisiz? Uning joriy natijasi o'chiriladi.",
    loading: "Yuklanmoqda...",
    answeredCount: "Javob berilgan",
  },
  kz: {
    title: "5B-сынып — Информатика бақылау жұмысы",
    loginTitle: "Оқушы кіруі",
    login: "Логин", password: "Құпия сөз", enter: "Кіру",
    adminLink: "Мұғалім үшін",
    studentLink: "Оқушы үшін",
    wrongCreds: "Логин немесе құпия сөз қате",
    startTest: "Тестті бастау",
    question: "сұрақ",
    next: "Келесі", prev: "Артқа", finish: "Тестті аяқтау",
    confirmFinish: "Тестті аяқтағыңыз келе ме? Кейін жауаптарды өзгерту мүмкін емес.",
    yourScore: "Сіздің нәтижеңіз",
    outOf: "ден",
    correct: "Дұрыс", wrong: "Қате", notAnswered: "Жауап берілмеген",
    reviewTitle: "Жауаптарыңыздың талдауы",
    logout: "Шығу",
    adminTitle: "Мұғалім тақтасы",
    adminLoginTitle: "Мұғалім кіруі",
    group: "Топ", fullName: "Т.А.Ж.", result: "Нәтиже", status: "Күй",
    doneStatus: "Тапсырылған", pendingStatus: "Әлі тапсырылмаған",
    reopen: "Қайта ашу", changePass: "Құпия сөзді өзгерту",
    adminChangeOwnPass: "Өз құпия сөзімді өзгерту",
    newPassword: "Жаңа құпия сөз", oldPassword: "Ескі құпия сөз", save: "Сақтау", cancel: "Бас тарту",
    passChanged: "Құпия сөз сәтті өзгертілді",
    confirmReopen: "Осы оқушы үшін тестті қайта ашқыңыз келе ме? Оның қазіргі нәтижесі өшіріледі.",
    loading: "Жүктелуде...",
    answeredCount: "Жауап берілді",
  }
};

let state = {
  lang: localStorage.getItem('lang_5b') || 'uz',
  view: 'student_login', // student_login | test | result | admin_login | admin_panel
  student: null,
  attempt: null,
  questions: [],
  currentIdx: 0,
  answers: {},
  admin: null,
  adminResults: [],
};

function t(key){ return T[state.lang][key]; }
function setLang(l){ state.lang = l; localStorage.setItem('lang_5b', l); render(); }

function app(){ return document.getElementById('app'); }

function langSwitchHtml(){
  return `<div class="lang-switch">
    <button onclick="setLang('uz')" class="${state.lang==='uz'?'active':''}">O'zbekcha</button>
    <button onclick="setLang('kz')" class="${state.lang==='kz'?'active':''}">Қазақша</button>
  </div>`;
}

function render(){
  const el = app();
  if(state.view==='student_login') el.innerHTML = viewStudentLogin();
  else if(state.view==='test') el.innerHTML = viewTest();
  else if(state.view==='result') el.innerHTML = viewResult();
  else if(state.view==='admin_login') el.innerHTML = viewAdminLogin();
  else if(state.view==='admin_panel') el.innerHTML = viewAdminPanel();
}

// ---------------- STUDENT LOGIN ----------------
function viewStudentLogin(){
  return `
  <div class="card">
    ${langSwitchHtml()}
    <h1>${t('title')}</h1>
    <div class="sub">${t('loginTitle')}</div>
    <label>${t('login')}</label>
    <input id="s_login" autocomplete="username" placeholder="ism.familiya">
    <label>${t('password')}</label>
    <input id="s_pass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:18px;">
      <button onclick="doStudentLogin()">${t('enter')}</button>
      <button class="secondary" onclick="state.view='admin_login'; render();">${t('adminLink')}</button>
    </div>
    <div class="error" id="s_err"></div>
  </div>`;
}

async function doStudentLogin(){
  const login = document.getElementById('s_login').value.trim().toLowerCase();
  const pass = document.getElementById('s_pass').value;
  const errEl = document.getElementById('s_err');
  errEl.textContent = t('loading');
  const { data, error } = await sb.rpc('student_login_5b', { p_login: login, p_password: pass });
  if(error || !data || data.length===0){
    errEl.textContent = t('wrongCreds');
    return;
  }
  state.student = data[0];
  await loadOrCreateAttempt();
}

async function loadOrCreateAttempt(){
  const { data, error } = await sb.rpc('get_or_create_attempt_5b', {
    p_student_id: state.student.student_id, p_language: state.lang
  });
  if(error || !data || data.length===0){
    alert('Xatolik: ' + (error ? error.message : 'attempt topilmadi'));
    return;
  }
  state.attempt = data[0];

  if(state.attempt.submitted_at){
    await loadReview();
    state.view = 'result';
    render();
    return;
  }

  const { data: qdata, error: qerr } = await sb.rpc('get_attempt_questions_5b', { p_attempt_id: state.attempt.attempt_id });
  if(qerr){ alert('Xatolik: ' + qerr.message); return; }
  state.questions = qdata;
  state.answers = state.attempt.answers || {};
  state.currentIdx = 0;
  state.view = 'test';
  render();
}

// ---------------- TEST ----------------
function viewTest(){
  const q = state.questions[state.currentIdx];
  const total = state.questions.length;
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round(((state.currentIdx) / total) * 100);

  let optsHtml = '';
  q.opts.forEach((opt, i) => {
    const selected = state.answers[q.qid] === i;
    optsHtml += `<div class="opt ${selected?'selected':''}" onclick="selectAnswer(${q.qid}, ${i})">
      <input type="radio" ${selected?'checked':''} readonly>
      <div>${escapeHtml(opt)}</div>
    </div>`;
  });

  return `
  <div class="card">
    <div class="topbar">
      <div class="muted">${state.student.full_name}</div>
      <div class="muted">${answeredCount}/${total} ${t('answeredCount')}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-box">
      <div class="q-num">${state.currentIdx+1}-${t('question')} / ${total}</div>
      <div class="q-text">${escapeHtml(q.q_text)}</div>
      ${optsHtml}
    </div>
    <div class="row" style="justify-content:space-between;">
      <button class="secondary" ${state.currentIdx===0?'disabled':''} onclick="prevQ()">${t('prev')}</button>
      ${state.currentIdx < total-1
        ? `<button onclick="nextQ()">${t('next')}</button>`
        : `<button onclick="finishTest()">${t('finish')}</button>`}
    </div>
  </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

async function selectAnswer(qid, idx){
  state.answers[qid] = idx;
  render();
  // fon rejimida saqlash (hali topshirilmagan holatda), xatolik bo'lsa jim e'tiborsiz qoldiriladi
  sb.rpc('save_progress_5b', { p_attempt_id: state.attempt.attempt_id, p_answers: state.answers }).catch(()=>{});
}

function nextQ(){ if(state.currentIdx < state.questions.length-1){ state.currentIdx++; render(); } }
function prevQ(){ if(state.currentIdx > 0){ state.currentIdx--; render(); } }

async function finishTest(){
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  if(answered < total){
    if(!confirm(`${answered}/${total} ${t('answeredCount')}. ${t('confirmFinish')}`)) return;
  } else {
    if(!confirm(t('confirmFinish'))) return;
  }
  const { data, error } = await sb.rpc('submit_attempt_5b', {
    p_attempt_id: state.attempt.attempt_id, p_answers: state.answers
  });
  if(error){ alert('Xatolik: ' + error.message); return; }
  await loadReview();
  state.view = 'result';
  render();
}

async function loadReview(){
  const { data, error } = await sb.rpc('get_attempt_review_5b', { p_attempt_id: state.attempt.attempt_id });
  state.review = data || [];
  const { data: a2 } = await sb.rpc('get_or_create_attempt_5b', { p_student_id: state.student.student_id, p_language: state.lang });
  if(a2 && a2.length>0) state.attempt = a2[0];
}

// ---------------- RESULT ----------------
function viewResult(){
  const score = state.attempt.score;
  const total = state.attempt.total;
  let rows = '';
  (state.review||[]).forEach((r, i) => {
    let optsHtml = '';
    r.opts.forEach((opt, idx) => {
      let cls = '';
      if(idx === r.correct_idx) cls = 'correct';
      else if(idx === r.given_idx && r.given_idx !== r.correct_idx) cls = 'wrong';
      optsHtml += `<div class="opt ${cls}">${escapeHtml(opt)}</div>`;
    });
    rows += `<div class="q-box">
      <div class="q-num">${i+1}-${t('question')}</div>
      <div class="q-text">${escapeHtml(r.q_text)}</div>
      ${optsHtml}
    </div>`;
  });

  return `
  <div class="card">
    <div class="topbar">
      <div>${state.student.full_name}</div>
      <button class="secondary small-btn" onclick="logout()">${t('logout')}</button>
    </div>
    <div class="score-big">${score} / ${total}</div>
    <div class="score-sub">${t('yourScore')}</div>
  </div>
  <div class="card">
    <h1 style="font-size:1.1rem;">${t('reviewTitle')}</h1>
    ${rows}
  </div>`;
}

function logout(){
  state.student = null; state.attempt = null; state.questions = []; state.answers = {};
  state.view = 'student_login'; render();
}

// ---------------- ADMIN LOGIN ----------------
function viewAdminLogin(){
  return `
  <div class="card">
    ${langSwitchHtml()}
    <h1>${t('adminLoginTitle')}</h1>
    <label>${t('login')}</label>
    <input id="a_login" autocomplete="username">
    <label>${t('password')}</label>
    <input id="a_pass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:18px;">
      <button onclick="doAdminLogin()">${t('enter')}</button>
      <button class="secondary" onclick="state.view='student_login'; render();">${t('studentLink')}</button>
    </div>
    <div class="error" id="a_err"></div>
  </div>`;
}

async function doAdminLogin(){
  const login = document.getElementById('a_login').value.trim();
  const pass = document.getElementById('a_pass').value;
  const errEl = document.getElementById('a_err');
  errEl.textContent = t('loading');
  const { data, error } = await sb.rpc('admin_login_5b', { p_login: login, p_password: pass });
  if(error || !data){ errEl.textContent = t('wrongCreds'); return; }
  state.admin = { login, password: pass };
  await loadAdminResults();
  state.view = 'admin_panel';
  render();
}

async function loadAdminResults(){
  const { data, error } = await sb.rpc('admin_list_results_5b', {
    p_admin_login: state.admin.login, p_admin_password: state.admin.password
  });
  state.adminResults = data || [];
}

// ---------------- ADMIN PANEL ----------------
function viewAdminPanel(){
  let rows = '';
  state.adminResults.forEach(r => {
    const done = !!r.submitted_at;
    rows += `<tr>
      <td>${escapeHtml(r.group_name)}</td>
      <td>${escapeHtml(r.full_name)}<div class="muted">${escapeHtml(r.login)}</div></td>
      <td>${done ? `<span class="pill done">${t('doneStatus')}</span>` : `<span class="pill pending">${t('pendingStatus')}</span>`}</td>
      <td>${done ? (r.score + ' / ' + r.total) : '—'}</td>
      <td>
        <div class="row">
          ${done ? `<button class="secondary small-btn" onclick="adminReopen('${r.student_id}')">${t('reopen')}</button>` : ''}
          <button class="secondary small-btn" onclick="adminChangePass('${r.student_id}','${escapeHtml(r.full_name)}')">${t('changePass')}</button>
        </div>
      </td>
    </tr>`;
  });

  return `
  <div class="card">
    <div class="topbar">
      <h1 style="margin:0;">${t('adminTitle')}</h1>
      <div class="row">
        <button class="secondary small-btn" onclick="openOwnPassModal()">${t('adminChangeOwnPass')}</button>
        <button class="secondary small-btn" onclick="adminLogout()">${t('logout')}</button>
      </div>
    </div>
    ${langSwitchHtmlAdmin()}
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>${t('group')}</th><th>${t('fullName')}</th><th>${t('status')}</th><th>${t('result')}</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>
  <div id="modal-slot"></div>`;
}

function langSwitchHtmlAdmin(){
  return `<div class="lang-switch" style="max-width:260px;">
    <button onclick="setLangAdmin('uz')" class="${state.lang==='uz'?'active':''}">UZ</button>
    <button onclick="setLangAdmin('kz')" class="${state.lang==='kz'?'active':''}">KZ</button>
  </div>`;
}
function setLangAdmin(l){ state.lang = l; localStorage.setItem('lang_5b', l); render(); }

async function adminReopen(studentId){
  if(!confirm(t('confirmReopen'))) return;
  const { error } = await sb.rpc('admin_reopen_test_5b', {
    p_admin_login: state.admin.login, p_admin_password: state.admin.password, p_student_id: studentId
  });
  if(error){ alert('Xatolik: ' + error.message); return; }
  await loadAdminResults();
  render();
}

function adminChangePass(studentId, name){
  document.getElementById('modal-slot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h1 style="font-size:1.05rem;">${escapeHtml(name)} — ${t('changePass')}</h1>
      <label>${t('newPassword')}</label>
      <input id="np_val" type="text">
      <div class="row" style="margin-top:16px;">
        <button onclick="submitStudentPass('${studentId}')">${t('save')}</button>
        <button class="secondary" onclick="closeModal()">${t('cancel')}</button>
      </div>
      <div class="error" id="np_err"></div>
    </div>
  </div>`;
}

async function submitStudentPass(studentId){
  const val = document.getElementById('np_val').value.trim();
  if(val.length < 4){ document.getElementById('np_err').textContent = '...'; return; }
  const { error } = await sb.rpc('admin_set_student_password_5b', {
    p_admin_login: state.admin.login, p_admin_password: state.admin.password,
    p_student_id: studentId, p_new_password: val
  });
  if(error){ document.getElementById('np_err').textContent = error.message; return; }
  closeModal();
}

function openOwnPassModal(){
  document.getElementById('modal-slot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h1 style="font-size:1.05rem;">${t('adminChangeOwnPass')}</h1>
      <label>${t('oldPassword')}</label>
      <input id="op_old" type="password">
      <label>${t('newPassword')}</label>
      <input id="op_new" type="password">
      <div class="row" style="margin-top:16px;">
        <button onclick="submitOwnPass()">${t('save')}</button>
        <button class="secondary" onclick="closeModal()">${t('cancel')}</button>
      </div>
      <div class="error" id="op_err"></div>
    </div>
  </div>`;
}

async function submitOwnPass(){
  const oldP = document.getElementById('op_old').value;
  const newP = document.getElementById('op_new').value.trim();
  if(newP.length < 4){ document.getElementById('op_err').textContent = '...'; return; }
  const { data, error } = await sb.rpc('admin_change_own_password_5b', {
    p_admin_login: state.admin.login, p_old_password: oldP, p_new_password: newP
  });
  if(error || !data){ document.getElementById('op_err').textContent = t('wrongCreds'); return; }
  state.admin.password = newP;
  closeModal();
  alert(t('passChanged'));
}

function closeModal(){ document.getElementById('modal-slot').innerHTML = ''; }

function adminLogout(){
  state.admin = null; state.adminResults = [];
  state.view = 'admin_login'; render();
}

render();
